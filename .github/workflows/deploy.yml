name: Deploy

# The build ships as an empty shell: content/ is gitignored, so a clean checkout
# has no packs. Subjects reach her phone through the app's import screen instead.
# See docs/CONTENT_GUIDE.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build is worse than a stale one once she relies on this, so the
      # checks run before anything is published rather than after.
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:sources
      - run: npm run build

      # enablement: true turns Pages on via the API, so the repo does not have to
      # be configured by hand first -- without it this step 404s on a repo where
      # Pages has never been switched on.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
